# Optional additive overlay. It leaves the default n8n stack unchanged.
services:
  activepieces-postgres:
    image: pgvector/pgvector:0.8.0-pg14@sha256:c55d7e7deac05dde62139e0ded4fcf4f58363656cbc382dbea82fbed995aa767
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AP_POSTGRES_DATABASE:?Run python3 scripts/add_activepieces_env.py}
      POSTGRES_USER: ${AP_POSTGRES_USERNAME:?Run python3 scripts/add_activepieces_env.py}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD:?Run python3 scripts/add_activepieces_env.py}
    volumes:
      - activepieces_postgres_data:/var/lib/postgresql/data
    networks: [activepieces_internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10

  activepieces-redis:
    image: redis:7.0.7@sha256:bb474c35022ca2c5618f4c49ca759bd2c0eea1daf5d934c560bd30092b97b498
    command: [redis-server, --appendonly, "yes"]
    restart: unless-stopped
    volumes:
      - activepieces_redis_data:/data
    networks: [activepieces_internal]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10

  activepieces-gateway:
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ACTIVEPIECES_PORT:-8080}:${ACTIVEPIECES_PORT:-8080}"
    environment:
      AP_GATEWAY_PORT: ${ACTIVEPIECES_PORT:-8080}
      NGINX_ENVSUBST_FILTER: AP_GATEWAY_PORT
    volumes:
      - ./activepieces/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    networks:
      activepieces_gateway: {}
      activepieces_internal:
        aliases:
          - activepieces.localhost
    depends_on:
      activepieces-app:
        condition: service_started

  activepieces-app:
    image: ghcr.io/activepieces/activepieces:0.92.1@sha256:d22e3f36f78d70264a020d309aa4535c161ba9ee25eeb783759cde3308cd803a
    restart: unless-stopped
    environment: &activepieces_environment
      AP_CONTAINER_TYPE: APP
      AP_ENVIRONMENT: prod
      AP_CLOUD_AUTH_ENABLED: "false"
      AP_FRONTEND_URL: ${AP_FRONTEND_URL:-http://activepieces.localhost:8080}
      AP_INTERNAL_URL: http://activepieces-app
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY:?Run python3 scripts/add_activepieces_env.py}
      AP_JWT_SECRET: ${AP_JWT_SECRET:?Run python3 scripts/add_activepieces_env.py}
      AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
      AP_DB_TYPE: POSTGRES
      AP_POSTGRES_HOST: activepieces-postgres
      AP_POSTGRES_PORT: "5432"
      AP_POSTGRES_DATABASE: ${AP_POSTGRES_DATABASE:?Run python3 scripts/add_activepieces_env.py}
      AP_POSTGRES_USERNAME: ${AP_POSTGRES_USERNAME:?Run python3 scripts/add_activepieces_env.py}
      AP_POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD:?Run python3 scripts/add_activepieces_env.py}
      AP_REDIS_TYPE: STANDALONE
      AP_REDIS_HOST: activepieces-redis
      AP_REDIS_PORT: "6379"
      AP_WEBHOOK_TIMEOUT_SECONDS: ${AP_WEBHOOK_TIMEOUT_SECONDS:-30}
    volumes:
      - activepieces_cache:/usr/src/app/cache
    networks: [activepieces_internal, knowledge_api]
    depends_on:
      activepieces-postgres:
        condition: service_healthy
      activepieces-redis:
        condition: service_healthy

  activepieces-worker:
    image: ghcr.io/activepieces/activepieces:0.92.1@sha256:d22e3f36f78d70264a020d309aa4535c161ba9ee25eeb783759cde3308cd803a
    restart: unless-stopped
    environment:
      <<: *activepieces_environment
      AP_CONTAINER_TYPE: WORKER
      AP_WORKER_CONCURRENCY: ${AP_WORKER_CONCURRENCY:-1}
    volumes:
      - activepieces_cache:/usr/src/app/cache
    networks: [activepieces_internal, knowledge_api]
    depends_on:
      activepieces-postgres:
        condition: service_healthy
      activepieces-redis:
        condition: service_healthy

networks:
  activepieces_internal:
    internal: true
  activepieces_gateway:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  activepieces_postgres_data:
  activepieces_redis_data:
  activepieces_cache:
