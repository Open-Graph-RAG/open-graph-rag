<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Open Graph RAG logo</title>
  <desc id="desc">A minimal open circular ring with a connected graph node motif forming a subtle G shape.</desc>
  <defs>
    <linearGradient id="ring" x1="176" y1="176" x2="848" y2="848" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14E6D2"/>
      <stop offset="0.48" stop-color="#2CB7F6"/>
      <stop offset="1" stop-color="#7257FF"/>
    </linearGradient>
    <linearGradient id="edge" x1="500" y1="330" x2="850" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#42E6D3"/>
      <stop offset="1" stop-color="#745BFF"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Open O: openness + knowledge loop -->
  <circle cx="512" cy="512" r="330"
          stroke="url(#ring)" stroke-width="92" stroke-linecap="round"
          stroke-dasharray="1690 430" transform="rotate(-39 512 512)"/>

  <!-- Graph / retrieval path: the horizontal branch makes the open O read as a subtle G -->
  <path d="M545 512 H785" stroke="url(#edge)" stroke-width="52" stroke-linecap="round"/>
  <path d="M585 512 L760 340" stroke="url(#edge)" stroke-width="42" stroke-linecap="round"/>
  <path d="M585 512 L760 684" stroke="url(#edge)" stroke-width="42" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="545" cy="512" r="72" fill="#18D9D0" filter="url(#softGlow)"/>
  <circle cx="785" cy="512" r="58" fill="#506AF7"/>
  <circle cx="760" cy="340" r="52" fill="#695BFF"/>
  <circle cx="760" cy="684" r="52" fill="#695BFF"/>

  <!-- Small retrieval spark / anchor -->
  <circle cx="545" cy="512" r="22" fill="white" fill-opacity="0.92"/>
</svg>
