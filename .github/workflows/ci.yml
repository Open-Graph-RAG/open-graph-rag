name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned test dependencies
        run: python -m pip install -r tests/requirements-ci.txt
      - name: Install ontology service dependencies
        run: |
          python -m venv /tmp/ontology-venv
          /tmp/ontology-venv/bin/pip install -r services/ontology/requirements.lock -r services/ontology_ui/requirements.lock
      - name: Ontology registry, governance, migrations and projection contracts
        run: /tmp/ontology-venv/bin/python -m unittest discover -s tests/ontology -v
      - name: Ontology console session and workspace contracts
        run: /tmp/ontology-venv/bin/python -m unittest discover -s services/ontology_ui/tests -v
      - name: Offline product validation contracts
        run: |
          python -m unittest discover -s validation/product/tests -v
          python -m validation.product.cli preflight
      - name: Ingestion helpers and workflow contracts
        run: node --test activepieces/helpers.test.cjs activepieces/workflows.test.cjs n8n/tests/*.test.cjs
      - name: MCP protocol and security contracts
        run: python -m unittest discover -s mcp/tests -v
      - name: Environment migration contracts
        run: python -m unittest discover -s scripts/tests -v
      - name: Isolated E2E guard unit tests
        run: python -m unittest discover -s tests/e2e -p 'test_*.py' -v

  config-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Generate disposable configuration
        run: python3 scripts/init_env.py
      - name: Check generated workflow freshness
        run: python3 activepieces/generate_workflows.py --check
      - name: Validate Compose configurations
        run: |
          docker compose version
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.activepieces.yaml config --quiet
          docker compose -f compose.yaml -f compose.activepieces.yaml -f tests/e2e/compose.mock.yaml config --quiet
          docker compose -f compose.yaml -f compose.activepieces.yaml -f tests/e2e/compose.local.yaml config --quiet
          docker compose -f compose.yaml -f compose.ontology.yaml config --quiet
          env OGR_VALIDATION_LIGHTRAG_KEY=ci-validation-only \
            OGR_VALIDATION_SNAPSHOT_ROOT=/tmp/ogr-validation-snapshot \
            OGR_VALIDATION_INPUTS_ROOT=/tmp/ogr-validation-inputs \
            OGR_VALIDATION_RUNS_ROOT=/tmp/ogr-validation-runs \
            docker compose -p ogr-validation-config -f validation/product/environments/compose.validation.yaml config --quiet

  ontology-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_PASSWORD: ontology-test-only
          POSTGRES_DB: ontology_test
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ONTOLOGY_TEST_DATABASE_URL: postgresql://postgres:ontology-test-only@127.0.0.1:5432/ontology_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/ontology/requirements.lock
      - run: python -m unittest discover -s tests/ontology -v

  ontology-lightrag-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/init_env.py
      - name: Start disposable governed stack with local provider mocks
        run: >-
          docker compose -p ontology-ci -f compose.yaml -f compose.ontology.yaml
          -f tests/ontology/compose.e2e.yaml up -d --build --wait --wait-timeout 300
          postgres mock-provider lightrag ontology ontology-projector ontology-gateway
      - name: Verify canonical facts reach pinned LightRAG retrieval
        run: >-
          docker compose -p ontology-ci -f compose.yaml -f compose.ontology.yaml
          -f tests/ontology/compose.e2e.yaml run --build --rm ontology-e2e-test
      - name: Capture service logs
        if: failure()
        run: >-
          docker compose -p ontology-ci -f compose.yaml -f compose.ontology.yaml
          -f tests/ontology/compose.e2e.yaml logs --tail=100
      - name: Remove disposable test data
        if: always()
        run: >-
          docker compose -p ontology-ci -f compose.yaml -f compose.ontology.yaml
          -f tests/ontology/compose.e2e.yaml down --timeout 1 -v
