name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned test dependencies
        run: python -m pip install -r tests/requirements-ci.txt
      - name: Install ontology service dependencies
        run: |
          python -m venv /tmp/ontology-venv
          /tmp/ontology-venv/bin/pip install -r services/ontology/requirements.lock
      - name: Ontology registry, governance, migrations and projection contracts
        run: /tmp/ontology-venv/bin/python -m unittest discover -s tests/ontology -v
      - name: Ingestion helpers and workflow contracts
        run: node --test activepieces/helpers.test.cjs activepieces/workflows.test.cjs n8n/tests/*.test.cjs
      - name: MCP protocol and security contracts
        run: python -m unittest discover -s mcp/tests -v
      - name: Environment migration contracts
        run: python -m unittest discover -s scripts/tests -v
      - name: Isolated E2E guard unit tests
        run: python -m unittest discover -s tests/e2e -p 'test_*.py' -v

  config-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Generate disposable configuration
        run: python3 scripts/init_env.py
      - name: Check generated workflow freshness
        run: python3 activepieces/generate_workflows.py --check
      - name: Validate Compose configurations
        run: |
          docker compose version
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.activepieces.yaml config --quiet
          docker compose -f compose.yaml -f compose.activepieces.yaml -f tests/e2e/compose.mock.yaml config --quiet
          docker compose -f compose.yaml -f compose.activepieces.yaml -f tests/e2e/compose.local.yaml config --quiet
          docker compose -f compose.yaml -f compose.ontology.yaml config --quiet

  ontology-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_PASSWORD: ontology-test-only
          POSTGRES_DB: ontology_test
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ONTOLOGY_TEST_DATABASE_URL: postgresql://postgres:ontology-test-only@127.0.0.1:5432/ontology_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/ontology/requirements.lock
      - run: python -m unittest discover -s tests/ontology -v

  ontology-lightrag-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIGHTRAG_IMAGE: ghcr.io/hkuds/lightrag:v1.5.7@sha256:5bdbd524931b011df246fe20888d110cef691e6804c12cde636a2b746d7de27e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore pinned LightRAG image cache
        id: lightrag-image-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/lightrag-image.tar
          key: lightrag-linux-amd64-5bdbd524931b011df246fe20888d110cef691e6804c12cde636a2b746d7de27e
      - name: Load cached pinned LightRAG image
        if: steps.lightrag-image-cache.outputs.cache-hit == 'true'
        run: docker image load --input /tmp/lightrag-image.tar
      - run: python scripts/init_env.py
      - name: Start disposable governed stack with local provider mocks
        run: >-
          docker compose -p ontology-ci -f compose.yaml -f compose.ontology.yaml
          -f tests/ontology/compose.e2e.yaml up -d --build --wait --wait-timeout 300
          postgres mock-provider lightrag ontology ontology-projector ontology-gateway
      - name: Archive pinned LightRAG image for cache
        if: steps.lightrag-image-cache.outputs.cache-hit != 'true'
        run: docker image save --output /tmp/lightrag-image.tar "$LIGHTRAG_IMAGE"
      - name: Save pinned LightRAG image cache
        if: steps.lightrag-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/lightrag-image.tar
          key: ${{ steps.lightrag-image-cache.outputs.cache-primary-key }}
      - name: Verify canonical facts reach pinned LightRAG retrieval
        run: >-
          docker compose -p ontology-ci -f compose.yaml -f compose.ontology.yaml
          -f tests/ontology/compose.e2e.yaml run --build --rm ontology-e2e-test
      - name: Capture service logs
        if: failure()
        run: >-
          docker compose -p ontology-ci -f compose.yaml -f compose.ontology.yaml
          -f tests/ontology/compose.e2e.yaml logs --tail=100
      - name: Remove disposable test data
        if: always()
        run: >-
          docker compose -p ontology-ci -f compose.yaml -f compose.ontology.yaml
          -f tests/ontology/compose.e2e.yaml down --timeout 1 -v
