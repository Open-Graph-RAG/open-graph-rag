name: Backup and restore

on:
  # Runs for every PR and merge-queue entry so the required restore-e2e check always
  # reports; the job skips the restore unless backup-related paths changed.
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - 'backup/**'
      - 'scripts/backup/**'
      - 'tests/backup/**'
      - 'deploy/systemd/**'
      - 'compose*.yaml'
      - '.github/workflows/backup-restore-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  restore-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BACKUP_E2E: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Detect backup-related changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(backup/|scripts/backup/|tests/backup/|deploy/systemd/|compose[^/]*\.yaml$|\.github/workflows/backup-restore-test\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No backup-related changes; restore test skipped."
          fi
      - name: Install Restic
        if: steps.changes.outputs.relevant == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes restic
      - name: Verify backup and isolated restore
        if: steps.changes.outputs.relevant == 'true'
        run: python3 -m unittest discover -s tests/backup -v
