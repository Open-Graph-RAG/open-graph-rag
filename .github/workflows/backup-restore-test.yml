name: Backup and restore

on:
  pull_request:
    paths:
      - 'backup/**'
      - 'scripts/backup/**'
      - 'tests/backup/**'
      - 'deploy/systemd/**'
      - 'compose*.yaml'
      - '.github/workflows/backup-restore-test.yml'
  push:
    branches: [main]
    paths:
      - 'backup/**'
      - 'scripts/backup/**'
      - 'tests/backup/**'
      - 'deploy/systemd/**'
      - 'compose*.yaml'
      - '.github/workflows/backup-restore-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  restore-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BACKUP_E2E: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Restic
        run: |
          sudo apt-get update
          sudo apt-get install --yes restic
      - name: Verify backup and isolated restore
        run: python3 -m unittest discover -s tests/backup -v
